# Render deployment configuration for our backend practice app
# This file tells Render.com how to build and run our Node.js application.

services:
  - type: web
    name: pennamesite
    env: node
    # Build command: install all npm dependencies listed in package.json
    buildCommand: npm install
    # Start command: run the server (Render sets PORT automatically)
    startCommand: node server.js
    # Health check: Render will ping this URL to verify the app is running
    healthCheckPath: /
    # Environment variables for production deployment
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true  # Render creates a random secret automatically
      # Where the app lives (used to build PayPal's return/cancel links).
      # Matches this service's URL.
      - key: APP_URL
        value: https://pennamesite.onrender.com
